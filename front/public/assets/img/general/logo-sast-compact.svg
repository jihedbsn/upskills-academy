<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E5BBA;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- SAST Acronym -->
  <g filter="url(#shadow)">
    <!-- Letter S (Gold) -->
    <path d="M8 10 Q13 8 18 10 Q23 12 23 17 Q23 22 18 25 Q13 27 8 25" 
          fill="url(#goldGradient)" stroke="#FFD700" stroke-width="1"/>
    
    <!-- Letter A (Blue) -->
    <path d="M25 25 L30 10 L35 25 M27 20 L33 20" 
          fill="url(#blueGradient)" stroke="#2E5BBA" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Runner Icon (White) -->
    <path d="M29 12 L31 15 L30 17 L29 15 L27 12" 
          fill="white" stroke="white" stroke-width="0.5"/>
    
    <!-- Letter S (Blue) -->
    <path d="M38 10 Q43 8 48 10 Q53 12 53 17 Q53 22 48 25 Q43 27 38 25" 
          fill="url(#blueGradient)" stroke="#2E5BBA" stroke-width="1"/>
    
    <!-- Letter T (Blue) -->
    <path d="M55 10 L65 10 M60 10 L60 25" 
          fill="url(#blueGradient)" stroke="#2E5BBA" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Full Name (Smaller) -->
  <g>
    <text x="60" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="white" stroke="#FFD700" stroke-width="0.3">
      SWEDISH ACADEMY
    </text>
    <text x="60" y="37" text-anchor="middle" font-family="Arial, sans-serif" font-size="4" font-weight="bold" fill="white" stroke="#FFD700" stroke-width="0.3">
      OF SPORT TRAINING
    </text>
  </g>
</svg>
